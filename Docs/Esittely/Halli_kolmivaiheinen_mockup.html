<!DOCTYPE html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halli kolmessa vaiheessa</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#2b2b33;color:#0b5c47;display:flex;flex-direction:column;align-items:center;padding:10px}
.jump{display:flex;gap:8px;margin-bottom:8px}.jump button{border:0;border-radius:14px;padding:8px 14px;font-size:15px;font-weight:700;background:#43434f;color:#fff;cursor:pointer}.jump button.on{background:#e4572e}
#wrap{width:360px;height:700px;transform-origin:top center}
.ph{width:360px;height:700px;border:8px solid #111;border-radius:38px;background:linear-gradient(#f9ecd3,#ecd8b0);display:flex;flex-direction:column;overflow:hidden;position:relative}
.top{display:flex;align-items:center;gap:8px;padding:12px 14px 4px}.pill{display:flex;align-items:center;gap:6px;background:#fff;border-radius:20px;padding:3px 12px 3px 4px;font-weight:800;font-size:20px;box-shadow:0 3px 0 #d9c49a}.pill img{width:30px;height:30px;background:#f4b860;border-radius:50%;padding:5px}
.prog{flex:1;display:flex;gap:6px}.prog i{flex:1;height:12px;border-radius:6px;background:#d9c49a;transition:background .3s}.prog i.on{background:#e4572e}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;animation:in .35s ease-out}
@keyframes in{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.title{margin:4px 16px 0;font-size:30px;font-weight:900;line-height:1.1}
.vilkku{display:flex;align-items:flex-end;gap:6px;margin:2px 12px 0}.vilkku img{width:70px;animation:wig 2.4s ease-in-out infinite;transform-origin:bottom center}
@keyframes wig{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-3px)}}
.bubble{background:#fff;border-radius:18px;padding:8px 12px;font-size:19px;font-weight:800;line-height:1.2;position:relative;margin-bottom:14px;box-shadow:0 3px 0 #d9c49a}.bubble:before{content:"";position:absolute;left:-9px;bottom:12px;border:9px solid transparent;border-right-color:#fff;border-left:0}
.stage{flex:1;display:flex;align-items:center;justify-content:center;gap:0;min-height:0}
.arr{background:none;border:0;padding:0;cursor:pointer;flex:0 0 auto}.arr img{width:58px;display:block;transition:transform .1s}.arr:active img{transform:scale(.85)}
.card{width:216px;background:#fff;border-radius:28px;border:5px solid #fff;box-shadow:0 6px 0 #d9c49a;overflow:hidden;position:relative}
.card.pop{animation:pop .35s}@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.art{height:150px;display:flex;align-items:center;justify-content:center;position:relative}.art svg{width:120px;height:120px;animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}
.name{font-size:26px;font-weight:900;padding:8px 14px 0}.desc{font-size:18px;font-weight:600;color:#44695f;padding:0 14px 12px;line-height:1.2}
.lock{position:absolute;inset:0;background:rgba(35,35,48,.68);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:800;gap:4px;text-align:center}.lock img{width:60px}.lock .need{display:flex;align-items:center;gap:6px}.lock .need img{width:28px;background:#f4b860;border-radius:50%;padding:4px}
.dots{display:flex;justify-content:center;gap:8px;margin:6px 0}.dots b{width:12px;height:12px;border-radius:50%;background:#d9c49a;transition:all .2s}.dots b.on{background:#e4572e;transform:scale(1.35)}
.stars{display:flex;gap:6px;padding:0 14px 12px}.stars span{width:34px;height:34px;border-radius:50%;background:#f4b860;display:flex;align-items:center;justify-content:center}.stars span.off{background:#e6dcc3}.stars img{width:22px}.stars span.off img{opacity:.35}
.nav{display:flex;gap:12px;padding:8px 16px 16px}
.btn{flex:1;min-height:64px;border:0;border-radius:24px;font-size:28px;font-weight:900;color:#fff;background:#1d9e75;box-shadow:0 7px 0 #0f6e56;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #0f6e56}.btn.back{flex:0 0 74px;background:#f4b860;box-shadow:0 7px 0 #c08a2e}.btn.back img{width:42px;transform:scaleX(-1)}
.btn.go{background:#e4572e;box-shadow:0 7px 0 #a63a1c;animation:pulse 1.4s infinite}@keyframes pulse{50%{transform:scale(1.03)}}.btn.go img{width:38px}
.btn.dis{background:#b9b1a0;box-shadow:0 7px 0 #8f8878;animation:none}
.mapimg{height:190px;width:100%;object-fit:cover;display:block}
.badge{position:absolute;top:8px;right:8px;background:#fff;border-radius:14px;padding:4px 10px;font-size:15px;font-weight:800;color:#1d9e75;display:flex;gap:4px;align-items:center}
.car{margin:2px 16px;border-radius:24px;background:#bfe6e0;display:flex;justify-content:center;padding:6px;position:relative;overflow:hidden;height:96px;align-items:center}.car img{height:82px;transition:filter .3s,transform .3s}.car.bounce img{animation:pop .4s}
.cat{display:flex;gap:6px;margin:8px 12px 0}.tab{flex:1;background:#fff;border-radius:16px;padding:6px 0 4px;text-align:center;font-size:15px;font-weight:800;border:4px solid #fff;cursor:pointer;box-shadow:0 4px 0 #d9c49a}.tab img{width:34px;height:34px;display:block;margin:0 auto}.tab.on{border-color:#e4572e;background:#fff3e8}
.parts{display:flex;gap:8px;margin:8px 12px 0}.part{flex:1;background:#fff;border-radius:18px;text-align:center;padding:8px 2px;font-size:17px;font-weight:800;border:4px solid #fff;cursor:pointer;box-shadow:0 4px 0 #d9c49a;position:relative}.part.on{border-color:#1d9e75;background:#eefaf4}.part .sw{width:44px;height:26px;border-radius:10px;margin:0 auto 4px}

.meters{margin:8px 12px 0;display:grid;grid-template-columns:1fr 1fr;gap:6px}.m{display:flex;flex-direction:column;gap:2px;background:#fff;border-radius:14px;padding:4px 10px}.m div.t{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:800}.m img{width:30px}.bar{height:14px;border-radius:7px;background:#e6dcc3;overflow:hidden}.bar i{display:block;height:100%;border-radius:7px;transition:width .4s}
.fit{margin:6px 12px 0;border-radius:14px;padding:6px 10px;font-size:17px;font-weight:900;text-align:center;transition:background .3s}.fit.ok{background:#d3f2dd;color:#0f6e56}.fit.no{background:#fde0d6;color:#a63a1c}
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}.conf i{position:absolute;width:10px;height:14px;border-radius:2px;animation:fall 1.6s ease-out forwards}@keyframes fall{from{transform:translate(0,0) rotate(0)}to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
.drive{position:absolute;left:-200px;bottom:90px;width:170px;z-index:6;animation:dr 1.3s ease-in forwards}@keyframes dr{to{left:420px}}
</style></head><body>

var packages=[{n:"Pizza",d:"Vie lämmin pizza!",c:"#ffe7a8",a:"pizza",lock:0,say:"Pizza on lämmintä. Ajetaan varovasti!"},{n:"Synttärikakku",d:"Älä kaada kakkua!",c:"#ffd6e3",a:"kakku",lock:0,say:"Kakku on herkkä. Vältä töyssyjä!"},{n:"Kukkaruukku",d:"Kukat haluavat hellän ajon.",c:"#d7f2c2",a:"kukka",lock:5,say:"Kukat tykkäävät hiljaisesta ajosta."},{n:"Akvaario",d:"Vettä ja kaloja kyydissä.",c:"#cdeaff",a:"akvaario",lock:12,say:"Vesi läikkyy! Pidä tasainen vauhti."},{n:"Jättijäätelö",d:"Sulaa nopeasti!",c:"#ffe3f4",a:"jaatelo",lock:20,say:"Jäätelö sulaa! Kerää lisää tähtiä."}];
var tracks=[{k:"satama",n:"Satama",d:"Laivoja ja nostureita.",s:3,lock:0,say:"Satamassa on lätäköitä. Väistä ne!"},{k:"puisto",n:"Puisto",d:"Puita ja pieni lampi.",s:2,lock:0,say:"Puistossa on mukava ajaa."},{k:"huvipuisto",n:"Huvipuisto",d:"Maailmanpyörä ja ilmapallot.",s:1,lock:8,say:"Hui, ilmapalloja! Ajetaan maaliin."},{k:"maatila",n:"Maatila",d:"Lehmiä ja punainen navetta.",s:0,lock:15,say:"Maatilalla on lampaita tiellä."},{k:"kyla",n:"Kylä",d:"Lunta ja pieniä taloja.",s:0,lock:25,say:"Kylässä on liukasta!"}];
var cats=[["kori","Kori"],["renkaat","Renkaat"],["moottori","Moottori"],["jouset","Jouset"],["lisat","Lisät"]];
var parts={kori:[["Pyöreä",0,[60,50,70,80]],["Laatikko",150,[40,70,50,95]],["Pitkä",300,[75,40,90,60]]],renkaat:[["Pienet","#555",[50,60,80,70]],["Isot","#222",[70,45,60,85]],["Maasto","#6b4f2a",[60,85,55,80]]],moottori:[["Hiljainen","#4dabf7",[40,50,90,80]],["Reipas","#e4572e",[70,60,60,70]],["Raketti","#ff6b6b",[95,35,40,50]]],jouset:[["Pehmeät","#8fd16b",[50,45,60,60]],["Normaalit","#1d9e75",[60,65,65,75]],["Jäykät","#0f6e56",[55,85,55,90]]],lisat:[["Ei mitään","#bbb",[50,50,70,70]],["Kilpi","#f4a542",[50,50,60,95]],["Tuuletin","#4dabf7",[55,55,85,60]]]};
var bodyHue=["hue-rotate(0deg)","hue-rotate(150deg)","hue-rotate(60deg)"];
var S={step:0,pk:0,tr:0,cat:0,sel:{kori:0,renkaat:0,moottori:0,jouset:0,lisat:0},dir:1,pop:0};
var ph=document.getElementById("ph");
function topBar(){var h='<div class="top"><div class="pill"><img src="'+IMG.tahti+'" alt="Tähdet">'+STARS+'</div><div class="prog">';for(var i=0;i<3;i++)h+='<i class="'+(i<=S.step?'on':'')+'"></i>';return h+'</div></div>';}
function vilkku(t){return '<div class="vilkku"><img src="'+IMG.vilkku+'" alt=""><div class="bubble">'+t+'</div></div>';}
function dots(n,a){var h='<div class="dots">';for(var i=0;i<n;i++)h+='<b class="'+(i==a?'on':'')+'"></b>';return h+'</div>';}
function lock(n){return '<div class="lock"><img src="'+IMG.lukko+'" alt=""><div>Vielä '+Math.max(0,n-STARS)+'</div><div class="need"><img src="'+IMG.tahti+'" alt="tähteä"></div></div>';}
function nav(back,label,go,icon,dis){return '<div class="nav">'+(back?'<button class="btn back" data-a="back" aria-label="Takaisin"><img src="'+IMG.oikea+'" alt=""></button>':'')+'<button class="btn '+(go?'go ':'')+(dis?'dis':'')+'" data-a="next">'+(icon?'<img src="'+IMG.pelaa+'" alt="">':'')+label+'</button></div>';}
function s0(){var p=packages[S.pk],l=p.lock>STARS;return '<div class="title">Mitä viedään?</div>'+vilkku(p.say)+'<div class="stage"><button class="arr" data-a="pk-1" aria-label="Edellinen"><img src="'+IMG.vasen+'" alt=""></button><div class="card '+(S.pop?'pop':'')+'"><div class="art" style="background:'+p.c+'">'+art[p.a]+'</div><div class="name">'+p.n+'</div><div class="desc">'+p.d+'</div>'+(l?lock(p.lock):'')+'</div><button class="arr" data-a="pk1" aria-label="Seuraava"><img src="'+IMG.oikea+'" alt=""></button></div>'+dots(packages.length,S.pk)+nav(false,l?'Lukittu':'Valitse',false,false,l);}
function s1(){var t=tracks[S.tr],l=t.lock>STARS;var h='<div class="stars">';for(var i=0;i<3;i++)h+='<span class="'+(i<t.s?'':'off')+'"><img src="'+IMG.tahti+'" alt=""></span>';h+='</div>';
return '<div class="title">Minne mennään?</div>'+vilkku(t.say)+'<div class="stage"><button class="arr" data-a="tr-1" aria-label="Edellinen"><img src="'+IMG.vasen+'" alt=""></button><div class="card '+(S.pop?'pop':'')+'" style="width:236px"><div style="position:relative"><img class="mapimg" src="'+RATA[t.k]+'" alt="'+t.n+'" style="height:170px">'+(l?lock(t.lock):'')+'<div class="badge">'+packages[S.pk].n+'</div></div><div class="name">'+t.n+'</div><div class="desc" style="padding-bottom:6px">'+t.d+'</div>'+h+'</div><button class="arr" data-a="tr1" aria-label="Seuraava"><img src="'+IMG.oikea+'" alt=""></button></div>'+dots(tracks.length,S.tr)+nav(true,l?'Lukittu':'Valitse',false,false,l);}
function s2(){var c=cats[S.cat][0],sum=[0,0,0,0];Object.keys(S.sel).forEach(function(k){var a=parts[k][S.sel[k]][2];for(var i=0;i<4;i++)sum[i]+=a[i];});var v=sum.map(function(x){return Math.round(x/5)});
var mm=[["voima","Voima","#e4572e"],["pito","Pito","#1d9e75"],["keveys","Keveys","#4dabf7"],["kestavyys","Kestää","#f4a542"]];
var need=packages[S.pk].a=="akvaario"||packages[S.pk].a=="kakku"?60:40,ok=v[1]>=need&&v[3]>=50;
var say=ok?"Hienoa! Auto on valmis.":"Tarvitaan enemmän pitoa. Kokeile jäykkiä jousia!";
var tint=bodyHue[S.sel.kori];
var body=c=="kori"?'':'';
return '<div class="title" style="font-size:28px">Rakenna auto</div><div class="car '+(S.pop?'bounce':'')+'"><img src="'+IMG.auto+'" alt="Auto" style="filter:'+tint+'"></div><div class="cat">'+cats.map(function(x,i){return '<div class="tab '+(i==S.cat?'on':'')+'" data-a="cat'+i+'"><img src="'+IMG[x[0]]+'" alt="">'+x[1]+'</div>'}).join('')+'</div><div class="parts">'+parts[c].map(function(p,i){var sw=typeof p[1]=="number"?'hsl('+(14+p[1])%360+',75%,55%)':p[1];if(typeof p[1]=="number")sw='hsl('+((14+p[1])%360)+',75%,55%)';return '<div class="part '+(i==S.sel[c]?'on':'')+'" data-a="part'+i+'"><div class="sw" style="background:'+sw+'"></div>'+p[0]+'</div>'}).join('')+'</div><div class="meters">'+mm.map(function(m,i){return '<div class="m"><div class="t"><img src="'+IMG[m[0]]+'" alt="">'+m[1]+'</div><div class="bar"><i style="width:'+v[i]+'%;background:'+m[2]+'"></i></div></div>'}).join('')+'</div><div class="fit '+(ok?'ok':'no')+'">'+say+'</div><div style="flex:1"></div>'+nav(true,ok?'Aja!':'Aja!',ok,true,!ok);}
function render(anim){var f=[s0,s1,s2];ph.innerHTML=topBar()+'<div class="screen" style="'+(anim===false?'animation:none':(S.dir<0?'animation-name:inL':''))+'">'+f[S.step]()+'</div>';
var j='';["1 Paketti","2 Rata","3 Auto"].forEach(function(n,i){j+='<button class="'+(i==S.step?'on':'')+'" data-j="'+i+'">'+n+'</button>'});document.getElementById("jump").innerHTML=j;S.pop=0;}
function confetti(){var box=document.createElement("div");box.className="conf";var cs=["#e4572e","#f4b860","#1d9e75","#4dabf7","#ff6b9d","#ffd43b"];for(var i=0;i<60;i++){var e=document.createElement("i");e.style.left="50%";e.style.top="60%";e.style.background=cs[i%6];e.style.setProperty("--dx",(Math.random()*340-170)+"px");e.style.setProperty("--dy",(Math.random()*-420+120)+"px");e.style.animationDelay=(Math.random()*.2)+"s";box.appendChild(e);}ph.appendChild(box);
var car=document.createElement("img");car.src=IMG.auto;car.className="drive";car.style.filter=bodyHue[S.sel.kori];ph.appendChild(car);setTimeout(function(){box.remove();car.remove();S.step=0;S.dir=-1;render();},1700);}
document.addEventListener("click",function(e){var jb=e.target.closest("[data-j]");if(jb){S.dir=+jb.dataset.j>=S.step?1:-1;S.step=+jb.dataset.j;render();return;}
var el=e.target.closest("[data-a]");if(!el)return;var a=el.getAttribute("data-a");S.dir=1;
if(a=="pk-1"){S.pk=(S.pk+packages.length-1)%packages.length;S.pop=1;S.dir=-1}else if(a=="pk1"){S.pk=(S.pk+1)%packages.length;S.pop=1}
else if(a=="tr-1"){S.tr=(S.tr+tracks.length-1)%tracks.length;S.pop=1;S.dir=-1}else if(a=="tr1"){S.tr=(S.tr+1)%tracks.length;S.pop=1}
else if(a.indexOf("cat")==0){S.cat=+a.slice(3)}else if(a.indexOf("part")==0){S.sel[cats[S.cat][0]]=+a.slice(4);S.pop=1}
else if(a=="back"){if(S.step>0){S.step--;S.dir=-1}}
else if(a=="next"){if(el.classList.contains("dis"))return;if(S.step<2){S.step++}else{confetti();return}}
render(a.indexOf("cat")==0||a.indexOf("part")==0||/^(pk|tr)/.test(a)?false:true);});
function fit(){var z=Math.min(1,(innerHeight-70)/712);var w=document.getElementById("wrap");w.style.transform="scale("+z+")";w.style.height=(700*z)+"px";w.style.width="360px";}
addEventListener("resize",fit);fit();render();
</script></body></html>
